# Same checks as .github/workflows/ci.yml, run from the locked environment (`uv sync` first).
# Install once: `uvx pre-commit install --hook-type pre-commit --hook-type pre-push`
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: js-tests
        name: node --test
        entry: node --test "tests/js/*.test.mjs"
        language: system
        pass_filenames: false
        files: ^(src/no_quiz_no_prod/ui/static/|tests/js/)
        stages: [pre-push]
