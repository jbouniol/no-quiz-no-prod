[project]
name = "no-quiz-no-prod"
version = "0.1.0"
description = "Agentic developer workbench that gates production deployment behind automated tests and adaptive comprehension verification."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jonathan Bouniol", email = "jbouniol@albertschool.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.49.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "mcp[cli]>=2.3.0",
    "openai>=3.31.0",
    "pydantic>=2.14.1",
    "pytest>=8.3.0",  # runtime: the gate runs the staged tests with `python -m pytest`
    "python-dotenv>=1.2.4",
    "uvicorn>=0.34.0",
]

[project.scripts]
no-quiz-no-prod = "no_quiz_no_prod.cli:main"
no-quiz-ui = "no_quiz_no_prod.ui.server:main"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "eval/run_eval.py"]
mypy_path = ["tests"]  # tests import the shared kit as a top-level module (`from testkit import ...`)
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
# pydantic's `@computed_field` on top of `@property` is correct at runtime; mypy cannot model that stacking
disable_error_code = ["prop-decorator"]

[[tool.mypy.overrides]]
module = ["test_eval_scorer"]
warn_unused_ignores = false
